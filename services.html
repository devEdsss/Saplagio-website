<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Straturoof provides professional roof repair and protection services.">
    <title>Straturoof | Roof repair services</title>
    <link rel="icon" type="image/x-icon" href="src/images/logo.webp">

    <link rel="stylesheet" href="dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- ===================== HERO ===================== -->
    <div class="hero">

        <!-- 1) BACKGROUND IMAGE -->
        <img class="hero__img" src="src/images/homepage.jpg" alt="" fetchpriority="high">

        <!-- 2) BLACK COVER -->
        <div class="hero__overlay"></div>

        <!-- 3) NAVIGATION -->
        <header>
            <nav class="navbar navbar-expand-md navbar-dark site-nav" aria-label="Main navigation">
                <div class="container-fluid px-4 px-md-5">
                    <!-- LOGO -->
                    <div class="navbar-brand text-center">
                        <a href="index.html" class="brand" aria-label="Straturoof home">
                            <svg class="brand__icon" viewBox="0 0 72 48" aria-hidden="true">
                                <path d="M4 44 L36 10 L68 44" />
                                <path d="M48 22 V8 H60 V35" />
                            </svg>
                            <span class="brand__text">STRATUROOF</span>
                        </a>
                    </div>
                    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                        data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="mainNav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" aria-current="page" href="index.html">Home</a></li>
                            <li class="nav-item"><a class="nav-link active" href="services.html"
                                    aria-current="page">Services</a></li>
                            <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                            <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                            <li class="nav-item"><a class="nav-link" href="faq.html">FAQ &amp; Tips</a></li>
                            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <!-- 4) HERO TEXT -->
        <main class="hero__content container-fluid px-4 px-md-5">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-8 col-lg-6 col-xl-5">
                        <h1 class="display">
                            test
                        </h1>
                    </div>

                    <div class="col-md-4 col-lg-6 col-xl-7">


                        <!-- 1st Row - 3 Col-->
                        <div class="row g-3 services-form">
                            <div class="col-md-4">
                                <h6 style="font-weight: 500; color: var(--navy);">Enter Your Name</h6>
                                <div class="form-floating text-dark">
                                    <input type="text" class="form-control rounded-0" id="f-name" placeholder="Name">
                                    <label for="f-name">Name</label>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <h6 style="font-weight: 500; color: var(--navy);">Enter Your Phone Number</h6>
                                <div class="form-floating text-dark">
                                    <input type="tel" class="form-control rounded-0" id="f-phone" placeholder="Phone">
                                    <label for="f-phone">Phone</label>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <h6 style="font-weight: 500; color: var(--navy);">Enter Your Email Address</h6>
                                <div class="form-floating text-dark">
                                    <input type="email" class="form-control rounded-0" id="f-email"
                                        placeholder="Email address">
                                    <label for="f-email">Email address</label>
                                </div>
                            </div>


                            <!-- 2nd Row - 2 Col -->
                            <div class="col-md-6">
                                <h6 style="font-weight: 500; color: var(--navy);">Select Service</h6>
                                <div class="form-floating">
                                    <select class="form-select rounded-0" id="f-service" aria-label="Services needed">
                                        <option selected>Roof Repair</option>
                                        <option value="1">Roof Replacement</option>
                                        <option value="2">Roof Leak Repair</option>
                                        <option value="3">Roof Inspection</option>
                                        <option value="4">Roof Gutter Cleaning</option>
                                        <option value="5">Roof Maintenance</option>
                                        <option value="6">Roof Cleaning</option>
                                    </select>
                                    <label for="f-service">Services</label>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <h6 style="font-weight: 500; color: var(--navy);">Select Property Type</h6>
                                <div class="form-floating">
                                    <select class="form-select rounded-0" id="f-service2" aria-label="Property Type">
                                        <option selected>House</option>
                                        <option value="1">Townhouse</option>
                                        <option value="2">Apartment</option>
                                        <option value="3">Commercial Building</option>
                                        <option value="4">Warehouse / Industrial</option>
                                        <option value="5">School / Church</option>
                                        <option value="6">Roof Cleaning</option>
                                    </select>
                                    <label for="f-service2">Property Type</label>
                                </div>
                            </div>

                            <!-- 3rd Row - 3 Col-->
                            <div class="col-md-4">
                                <h6 style="font-weight: 500; color: var(--navy);">Address</h6>
                                <div class="form-floating text-dark">
                                    <input type="text" class="form-control rounded-0" id="f-extra2"
                                        placeholder="Address">
                                    <label for="f-extra2">Address</label>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <h6 style="font-weight: 500; color: var(--navy);">Preferred date</h6>
                                <div class="form-floating text-dark">
                                    <input type="date" class="form-control rounded-0" id="f-extra3"
                                        placeholder="Preferred date">
                                    <label for="f-extra3">Preferred date</label>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <h6 style="font-weight: 500; color: var(--navy);">How urgent is it</h6>
                                <div class="form-floating">
                                    <select class="form-select rounded-0" id="f-service2" aria-label="How Urgent is it">
                                        <option selected>Emergency</option>
                                        <option value="1">Within a week</option>
                                        <option value="2">Within a month</option>
                                        <option value="3">Flexible / just planning</option>
                                    </select>
                                    <label for="f-service2">How Urgent is it</label>
                                </div>
                            </div>

                            <!-- Button -->
                            <div class="col-12 d-flex justify-content-end">
                                <button class="btn btn-lg btn-contact-us-now rounded-0" type="button">
                                    Contact Us Now
                                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
                                        viewBox="0 0 24 24">
                                        <path d="M0 0h24v24H0z" fill="none" />
                                        <path fill="none" stroke="currentColor" stroke-linecap="round"
                                            stroke-linejoin="round" stroke-width="2"
                                            d="M10.554 6.24L7.171 2.335c-.39-.45-1.105-.448-1.558.006L2.831 5.128c-.828.829-1.065 2.06-.586 3.047a29.2 29.2 0 0 0 13.561 13.58c.986.479 2.216.242 3.044-.587l2.808-2.813c.455-.455.456-1.174.002-1.564l-3.92-3.365c-.41-.352-1.047-.306-1.458.106l-1.364 1.366a.46.46 0 0 1-.553.088a14.56 14.56 0 0 1-5.36-5.367a.46.46 0 0 1 .088-.554l1.36-1.361c.412-.414.457-1.054.101-1.465" />
                                    </svg>

                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="dist/js/bootstrap.bundle.min.js"></script>
    </div>
</body>
</html>
